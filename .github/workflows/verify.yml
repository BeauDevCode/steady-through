name: Verify and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Analyze and test (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test native CI report and simulator helpers
        run: python -m unittest discover -s tool/ci -p 'test_*.py'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
        timeout-minutes: 5
      - run: flutter analyze
        timeout-minutes: 10
      - run: flutter test
        timeout-minutes: 15

  android:
    name: Android APK (Ubuntu, development signing)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
        timeout-minutes: 5
      - run: flutter build apk --release
        timeout-minutes: 20
      - name: Test Android motion classification and session state
        timeout-minutes: 10
        working-directory: android
        run: ./gradlew :app:testReleaseUnitTest
      - name: Preserve Android unit-test evidence
        uses: actions/upload-artifact@v4
        with:
          name: android-motion-unit-results
          path: build/app/test-results/testReleaseUnitTest/*.xml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-ci-not-play-signed
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Enable Android emulator KVM
        timeout-minutes: 2
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p build
      - name: Run native Android smoke tests
        timeout-minutes: 35
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-port: 5554
          emulator-boot-timeout: 600
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash -o pipefail -c 'flutter -v test integration_test/native_smoke_test.dart -d emulator-5554 --reporter expanded --file-reporter json:build/native-android-results.json --timeout 5m 2>&1 | tee build/native-android.log'
      - name: Verify actual Android native test execution
        if: always()
        shell: bash
        timeout-minutes: 2
        run: |
          mkdir -p build
          python tool/ci/verify_native_results.py build/native-android-results.json 2>&1 | tee build/native-android-verification.log
      - name: Preserve Android native runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-runtime-results
          path: build/native-android*
          if-no-files-found: error

  ios_simulator:
    name: iOS simulator (macOS, no code signing)
    needs: verify
    runs-on: macos-26
    # This image installs the default runtime for Xcode 26.5, while 26.6's
    # requested patch runtime is absent. Keep compiler/runtime selection aligned.
    # https://github.com/actions/runner-images/blob/main/images/macos/toolsets/toolset-26.json
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
        timeout-minutes: 5
      - run: flutter build ios --simulator --debug
        timeout-minutes: 20
      - name: Archive simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app steady-through-ios-simulator-ci.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-debug-no-signing
          path: steady-through-ios-simulator-ci.zip
          if-no-files-found: error
      - name: Select and boot an available iPhone simulator
        shell: bash
        timeout-minutes: 15
        run: |
          mkdir -p build
          xcodebuild -version | tee build/native-ios-xcode.log
          xcrun --sdk iphonesimulator --show-sdk-version | tee build/native-ios-sdk.log
          python tool/ci/prepare_ios_simulator.py 2>&1 | tee build/native-ios-simulator.log
      - name: Run native iOS smoke tests
        shell: bash
        timeout-minutes: 20
        run: flutter -v test integration_test/native_smoke_test.dart -d "$STEADY_IOS_SIMULATOR_ID" --reporter expanded --file-reporter json:build/native-ios-results.json --timeout 5m 2>&1 | tee build/native-ios.log
      - name: Capture iOS Simulator diagnostics
        if: always()
        shell: bash
        timeout-minutes: 3
        run: python tool/ci/capture_ios_diagnostics.py
      - name: Verify actual iOS native test execution
        if: always()
        shell: bash
        timeout-minutes: 2
        run: |
          mkdir -p build
          python tool/ci/verify_native_results.py build/native-ios-results.json 2>&1 | tee build/native-ios-verification.log
      - name: Preserve iOS native runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-runtime-results
          path: build/native-ios*
          if-no-files-found: error

  macos:
    name: macOS app (no distribution signing)
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
        timeout-minutes: 5
      - run: flutter build macos --release
        timeout-minutes: 20
      - name: Archive macOS app
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" steady-through-macos-ci.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app-ci-not-notarized
          path: steady-through-macos-ci.zip
          if-no-files-found: error
      - name: Run native macOS smoke tests
        shell: bash
        timeout-minutes: 20
        run: |
          mkdir -p build
          flutter test integration_test/native_smoke_test.dart -d macos --reporter expanded --file-reporter json:build/native-macos-results.json --timeout 5m 2>&1 | tee build/native-macos.log
      - name: Verify actual macOS native test execution
        if: always()
        shell: bash
        timeout-minutes: 2
        run: |
          mkdir -p build
          python tool/ci/verify_native_results.py build/native-macos-results.json 2>&1 | tee build/native-macos-verification.log
      - name: Preserve macOS native runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-native-runtime-results
          path: build/native-macos*
          if-no-files-found: error

  windows:
    name: Windows app (Windows, unsigned)
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
        timeout-minutes: 5
      - run: flutter build windows --release
        timeout-minutes: 20
      - name: Archive Windows bundle
        shell: pwsh
        run: Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'steady-through-windows-ci.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app-ci-unsigned
          path: steady-through-windows-ci.zip
          if-no-files-found: error
      - name: Run native Windows smoke tests
        shell: bash
        timeout-minutes: 20
        run: |
          mkdir -p build
          flutter test integration_test/native_smoke_test.dart -d windows --reporter expanded --file-reporter json:build/native-windows-results.json --timeout 5m 2>&1 | tee build/native-windows.log
      - name: Verify actual Windows native test execution
        if: always()
        shell: bash
        timeout-minutes: 2
        run: |
          mkdir -p build
          python tool/ci/verify_native_results.py build/native-windows-results.json 2>&1 | tee build/native-windows-verification.log
      - name: Preserve Windows native runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-runtime-results
          path: build/native-windows*
          if-no-files-found: error

  linux:
    name: Linux app (Ubuntu, unsigned)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux desktop build tools
        # A cold hosted mirror took more than ten minutes for 27 MB. Keep the
        # dependency wait bounded without cutting off a progressing download.
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev xvfb xauth
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
        timeout-minutes: 5
      - run: flutter build linux --release
        timeout-minutes: 20
      - name: Archive Linux bundle
        run: tar -czf steady-through-linux-ci.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-app-ci-unsigned
          path: steady-through-linux-ci.tar.gz
          if-no-files-found: error
      - name: Run native Linux smoke tests under Xvfb
        shell: bash
        timeout-minutes: 20
        run: |
          mkdir -p build
          xvfb-run -a flutter test integration_test/native_smoke_test.dart -d linux --reporter expanded --file-reporter json:build/native-linux-results.json --timeout 5m 2>&1 | tee build/native-linux.log
      - name: Verify actual Linux native test execution
        if: always()
        shell: bash
        timeout-minutes: 2
        run: |
          mkdir -p build
          python tool/ci/verify_native_results.py build/native-linux-results.json 2>&1 | tee build/native-linux-verification.log
      - name: Preserve Linux native runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-runtime-results
          path: build/native-linux*
          if-no-files-found: error

  ios_device_release:
    name: iPhoneOS Release (macOS, unsigned, not installable)
    needs: verify
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Record unsigned device source and toolchain evidence
        shell: bash
        timeout-minutes: 3
        run: |
          mkdir -p build
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          command = ['flutter', 'build', 'ios', '--release', '--no-codesign', '--target', 'lib/main.dart']
          provenance = {
              'source': os.environ['GITHUB_SHA'],
              'repository': os.environ['GITHUB_REPOSITORY'],
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'runAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'command': command,
              'productionTarget': 'lib/main.dart',
              'codeSigning': False,
              'developerDir': os.environ['DEVELOPER_DIR'],
          }
          provenance_path = Path('build/ios-device-release-provenance.json')
          provenance_path.write_text(json.dumps(provenance, indent=2, sort_keys=True) + '\n')
          def capture(*args):
              return subprocess.check_output(args, text=True).strip()
          flutter = json.loads(capture('flutter', '--version', '--machine'))
          xcode = capture('xcodebuild', '-version')
          sdk = capture('xcrun', '--sdk', 'iphoneos', '--show-sdk-version')
          toolchain = {'flutter': flutter, 'xcode': xcode, 'iphoneosSDKVersion': sdk,
                       'developerDir': os.environ['DEVELOPER_DIR']}
          Path('build/ios-device-release-toolchain.json').write_text(json.dumps(toolchain, indent=2, sort_keys=True) + '\n')
          provenance.update(flutterVersion=flutter['frameworkVersion'], xcodeVersion=xcode, iphoneosSDKVersion=sdk)
          provenance_path.write_text(json.dumps(provenance, indent=2, sort_keys=True) + '\n')
          if flutter['frameworkVersion'] != '3.47.9' or not xcode.startswith('Xcode 26.5\n') or sdk != '26.5':
              raise SystemExit('Unexpected pinned device toolchain')
          PY
      - run: flutter pub get
        timeout-minutes: 5
      - name: Build production iPhoneOS Release without code signing
        shell: bash
        timeout-minutes: 30
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign --target lib/main.dart 2>&1 | tee build/ios-device-release-build.log
      - name: Validate unsigned device directory
        timeout-minutes: 2
        run: python tool/ci/verify_ios_device_bundle.py build/ios/iphoneos/Runner.app --pubspec pubspec.yaml --report build/ios-device-release-validation.json
      - name: Archive the complete logical unsigned device app
        timeout-minutes: 3
        run: ditto -c -k --keepParent --norsrc --noextattr --noqtn build/ios/iphoneos/Runner.app steady-through-ios-device-release-unsigned-ci.zip
      - name: Verify exact device archive against validated directory
        timeout-minutes: 2
        run: python tool/ci/verify_ios_device_bundle.py build/ios/iphoneos/Runner.app --pubspec pubspec.yaml --report build/ios-device-release-validation.json --archive steady-through-ios-device-release-unsigned-ci.zip
      - name: Preserve unsigned device package (not installable)
        uses: actions/upload-artifact@v4
        with:
          name: ios-device-release-unsigned-not-installable
          path: steady-through-ios-device-release-unsigned-ci.zip
          if-no-files-found: error
      - name: Preserve device source, toolchain, build and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-device-release-evidence
          path: |
            build/ios-device-release-build.log
            build/ios-device-release-toolchain.json
            build/ios-device-release-provenance.json
            build/ios-device-release-validation.json
          if-no-files-found: warn
